<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taiwan Weather Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: Arial, "Microsoft JhengHei", sans-serif; background:#f5f7fa; margin:0; color:#233347; }
    .container { width:90%; max-width:1000px; margin:40px auto; }
    .card { background:white; padding:24px; margin-bottom:24px; border-radius:12px; box-shadow:0 2px 8px #0001; }
    select,input { padding:10px; font-size:16px; max-width:100%; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px; text-align:center; border-bottom:1px solid #ddd; white-space:nowrap; }
    th { background:#f0f2f5; }
    .table-scroll { overflow-x:auto; }
    .chart-container { height:400px; }
    iframe { width:100%; height:600px; border:0; }
    .legend { line-height:2; }
    .note { color:#536374; }
    @media(max-width:600px) { .container {width:94%;margin:20px auto} .card {padding:16px} h1 {font-size:26px} }
  </style>
</head>
<body>
  <main class="container">
    <h1>Taiwan Weather Dashboard</h1>
    <p>中央氣象署一週溫度預報</p>
    <section class="card">
      <h2>台灣氣溫地圖</h2>
      <label for="mapDate">選擇日期</label>
      <input type="date" id="mapDate" disabled>
      <p>顯示所選日期的全臺縣市。點擊標記查看最低溫、最高溫與平均溫。</p>
      <p class="legend">🔵 &lt; 20°C　🟢 20 ≤ 溫度 &lt; 25°C　🟠 25 ≤ 溫度 ≤ 30°C　🔴 &gt; 30°C</p>
      <p id="mapStatus" role="status">地圖載入中…</p>
      <iframe id="weatherMap" title="台灣各縣市氣溫地圖" hidden></iframe>
      <p class="note">平均溫為最低溫與最高溫的算術平均。此頁為資料快照，更新資料後需重新部署。</p>
    </section>
    <section class="card">
      <h2><label for="regionSelect">選擇地區</label></h2>
      <select id="regionSelect" disabled></select>
    </section>
    <section class="card">
      <h2 id="chartTitle">一週溫度趨勢</h2>
      <div class="chart-container"><canvas id="temperatureChart"></canvas></div>
    </section>
    <section class="card">
      <h2>詳細資料</h2>
      <div class="table-scroll"><table>
        <thead><tr><th>地區</th><th>日期</th><th>最低溫</th><th>最高溫</th></tr></thead>
        <tbody id="weatherTable"></tbody>
      </table></div>
    </section>
  </main>
  <script>
    let weatherData = [];
    let temperatureChart = null;
    async function loadWeatherData() {
      try {
        const response = await fetch("weather.json");
        if (!response.ok) throw new Error();
        weatherData = await response.json();
        const regions = [...new Set(weatherData.map(item => item.regionName))];
        const select = document.getElementById("regionSelect");
        regions.forEach(region => select.add(new Option(region, region)));
        if (!regions.length) {
          document.getElementById("chartTitle").textContent = "目前資料庫中沒有天氣資料。";
          return;
        }
        select.disabled = false;
        select.addEventListener("change", () => showRegion(select.value));
        showRegion(regions[0]);
      } catch {
        document.getElementById("chartTitle").textContent = "天氣資料載入失敗，請稍後重新整理。";
      }
    }
    function showRegion(region) {
      const data = weatherData.filter(item => item.regionName === region);
      document.getElementById("chartTitle").textContent = region + " 一週溫度趨勢";
      const table = document.getElementById("weatherTable");
      table.replaceChildren();
      data.forEach(item => {
        const row = document.createElement("tr");
        [item.regionName, item.dataDate, item.minT + " °C", item.maxT + " °C"].forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });
        table.appendChild(row);
      });
      if (typeof Chart === "undefined") {
        document.getElementById("chartTitle").textContent += "（圖表載入失敗，請參考明細表）";
        return;
      }
      if (temperatureChart) temperatureChart.destroy();
      temperatureChart = new Chart(document.getElementById("temperatureChart"), {
        type:"line",
        data: {
          labels:data.map(item => item.dataDate),
          datasets:[
            {label:"最低溫 (°C)",data:data.map(item => item.minT),borderColor:"#1976d2",tension:0.25},
            {label:"最高溫 (°C)",data:data.map(item => item.maxT),borderColor:"#d32f2f",tension:0.25}
          ]
        },
        options:{responsive:true,maintainAspectRatio:false}
      });
    }
    async function loadMaps() {
      const status = document.getElementById("mapStatus");
      const picker = document.getElementById("mapDate");
      const frame = document.getElementById("weatherMap");
      try {
        const response = await fetch("maps.json");
        if (!response.ok) throw new Error("地圖資料載入失敗，請稍後重新整理。");
        const maps = await response.json();
        const dates = Object.keys(maps).sort();
        if (!dates.length) { status.textContent = "目前資料庫中沒有天氣資料。"; return; }
        picker.min = dates[0]; picker.max = dates[dates.length - 1];
        picker.value = dates[0]; picker.disabled = false;
        function showMap() {
          const entry = maps[picker.value];
          frame.hidden = true;
          frame.removeAttribute("src");
          if (!entry) { status.textContent = "這個日期沒有天氣資料。"; return; }
          status.textContent = picker.value + " · 顯示 " + entry.count + " 個縣市。 " + entry.warnings.join(" ");
          frame.title = picker.value + " 台灣各縣市氣溫地圖";
          frame.src = entry.url; frame.hidden = false;
        }
        picker.addEventListener("change", showMap);
        showMap();
      } catch(error) { status.textContent = error.message; }
    }
    loadWeatherData();
    loadMaps();
  </script>
</body>
</html>
